---
volumes:
  data:

services:
  portainer:
    image: portainer/portainer-ee:2.45.4
    container_name: portainer
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true

