---
- name: Check if control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --apiserver-advertise-address={{ ansible_host }}
      --pod-network-cidr={{ pod_network_cidr }}
  when: not kubeadm_admin_conf.stat.exists
  changed_when: not kubeadm_admin_conf.stat.exists

- name: Create .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Copy admin kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"

- name: Install Flannel CNI
  ansible.builtin.command:
    cmd: >
      kubectl apply -f
      https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_result
  changed_when: >
    'created' in flannel_result.stdout or
    'configured' in flannel_result.stdout

- name: Generate join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: join_command
  changed_when: true

- name: Show join command
  ansible.builtin.debug:
    msg: "{{ join_command.stdout }}"

- name: Store join command
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_command.stdout }}"
