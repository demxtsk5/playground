---
- name: Get kubeadm version
  ansible.builtin.command:
    cmd: kubeadm version -o short
  register: kubeadm_version
  changed_when: false

- name: Get kubelet version
  ansible.builtin.command:
    cmd: kubelet --version
  register: kubelet_version
  changed_when: false

- name: Show node information
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "Role: {{ 'master' if inventory_hostname in groups['kube_master'] else 'worker' }}"
      - "Kubeadm: {{ kubeadm_version.stdout }}"
      - "Kubelet: {{ kubelet_version.stdout }}"

- name: Show available upgrade plan
  ansible.builtin.command:
    cmd: kubeadm upgrade plan
  register: upgrade_plan
  changed_when: false
  when: inventory_hostname in groups['kube_master']

- name: Display upgrade plan
  ansible.builtin.debug:
    var: upgrade_plan.stdout_lines
  when: inventory_hostname in groups['kube_master']

- name: Show upgrade target
  ansible.builtin.debug:
    msg:
      - "Current repository version: {{ k8s_version }}"
      - "Target upgrade version: {{ upgrade_target_version }}"

- name: Check available kubeadm versions
  ansible.builtin.command:
    cmd: apt-cache madison kubeadm
  register: kubeadm_versions
  changed_when: false
  when: inventory_hostname in groups['kube_master']

- name: Show available kubeadm versions
  ansible.builtin.debug:
    var: kubeadm_versions.stdout_lines
  when: inventory_hostname in groups['kube_master']

- name: Add temporary upgrade repository
  ansible.builtin.deb822_repository:
    name: kubernetes-upgrade
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/{{ upgrade_target_version }}/deb/"
    suites: ["/"]
    components: []
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ upgrade_target_version }}/deb/Release.key"
    state: present
    install_python_debian: true
  when: inventory_hostname in groups['kube_master']

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: inventory_hostname in groups['kube_master']

- name: Check kubeadm versions after adding target repository
  ansible.builtin.command:
    cmd: apt-cache madison kubeadm
  register: kubeadm_versions_target
  changed_when: false
  when: inventory_hostname in groups['kube_master']

- name: Show kubeadm versions after adding target repository
  ansible.builtin.debug:
    var: kubeadm_versions_target.stdout_lines
  when: inventory_hostname in groups['kube_master']

- name: Simulate kubeadm upgrade package
  ansible.builtin.command:
    argv:
      - apt-get
      - -s
      - install
      - "kubeadm={{ upgrade_target_package_version }}"
  register: kubeadm_simulation
  changed_when: false
  when: inventory_hostname in groups['kube_master']

- name: Show simulation result
  ansible.builtin.debug:
    var: kubeadm_simulation.stdout_lines
  when: inventory_hostname in groups['kube_master']
