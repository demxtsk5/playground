---
- name: Add temporary upgrade repository
  ansible.builtin.deb822_repository:
    name: kubernetes-upgrade
    types: [deb]
    uris: "https://pkgs.k8s.io/core:/stable:/{{ upgrade_target_version }}/deb/"
    suites: ["/"]
    components: []
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ upgrade_target_version }}/deb/Release.key"
    state: present
    install_python_debian: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Drain worker node
  ansible.builtin.command:
    cmd: >
      kubectl drain {{ inventory_hostname }}
      --ignore-daemonsets
      --delete-emptydir-data
  delegate_to: "{{ groups['kube_master'][0] }}"
  changed_when: true

- name: Upgrade kubeadm on worker
  ansible.builtin.apt:
    name: "kubeadm={{ upgrade_target_package_version }}"
    state: present
    allow_change_held_packages: true

- name: Verify kubeadm version
  ansible.builtin.command:
    cmd: kubeadm version -o short
  register: kubeadm_version_after
  changed_when: false

- name: Show kubeadm version
  ansible.builtin.debug:
    var: kubeadm_version_after.stdout

- name: Upgrade worker node configuration
  ansible.builtin.command:
    cmd: kubeadm upgrade node
  register: kubeadm_upgrade_node
  changed_when: true

- name: Show worker upgrade result
  ansible.builtin.debug:
    var: kubeadm_upgrade_node.stdout_lines

- name: Upgrade kubelet and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ upgrade_target_package_version }}"
      - "kubectl={{ upgrade_target_package_version }}"
    state: present
    allow_change_held_packages: true

- name: Restart kubelet
  ansible.builtin.service:
    name: kubelet
    state: restarted

- name: Wait for node to become Ready
  ansible.builtin.command:
    cmd: kubectl get node {{ inventory_hostname }}
  delegate_to: "{{ groups['kube_master'][0] }}"
  register: node_ready
  until: "'NotReady' not in node_ready.stdout"
  retries: 30
  delay: 10
  changed_when: false

- name: Uncordon worker node
  ansible.builtin.command:
    cmd: kubectl uncordon {{ inventory_hostname }}
  delegate_to: "{{ groups['kube_master'][0] }}"
  changed_when: true
