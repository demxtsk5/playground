---
- name: Kubernetes Upgrade Preparation
  hosts:
    - kube
  become: true

  tasks:
    - name: Common OS preparation
      ansible.builtin.include_tasks:
        file: tasks/upgrade-checks.yml
        apply:
          tags:
            - preparation
      tags:
        - preparation

    - name: Upgrade Control Plane
      ansible.builtin.include_tasks:
        file: tasks/upgrade-control-plane.yml
        apply:
          tags:
            - upgrade_control_plane
      when:
        - inventory_hostname in groups['kube_master']
      tags:
        - never
        - upgrade_control_plane

    - name: Upgrade Workers
      ansible.builtin.include_tasks:
        file: tasks/upgrade-workers.yml
        apply:
          tags:
            - upgrade_workers
      when:
        - inventory_hostname in groups['kube_worker']
      tags:
        - never
        - upgrade_workers
