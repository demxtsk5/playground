---
- name: macOS-Wartung und Updates durchführen
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Homebrew Update und Upgrade ausführen
      tags:
        - brew
      when: ansible_facts['hostname'] in ["L00026E", "HIER-ZWEITEN-HOSTNAME-EINTRAGEN"]
      vars:
        brew_prefix: "{{ ansible_facts['user_dir'] }}/b"
        brew_bin: "{{ brew_prefix }}/bin/brew"
        askpass_script: "{{ ansible_facts['user_dir'] }}/.local/bin/macos-askpass.sh"
      environment:
        PATH: "{{ brew_prefix }}/bin:{{ brew_prefix }}/sbin:{{ ansible_facts['env']['PATH'] }}"
        HOMEBREW_CASK_OPTS: "--appdir=~/Applications"
        HOMEBREW_NO_BUILD_FROM_SOURCE: "1"
        HOMEBREW_NO_ENV_HINTS: "1"
        SUDO_ASKPASS: "{{ askpass_script }}"
      block:
        - name: Zielverzeichnis für das Askpass-Skript sicherstellen
          ansible.builtin.file:
            path: "{{ askpass_script | dirname }}"
            state: directory
            mode: "0755"

        - name: Sicherstellen, dass das Askpass-Skript vorhanden und ausführbar ist
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/macos-askpass.sh"
            dest: "{{ askpass_script }}"
            mode: "0755"

        - name: Prüfen, ob Homebrew vorhanden ist
          ansible.builtin.stat:
            path: "{{ brew_bin }}"
          register: brew_stat

        - name: Homebrew-Paketlisten aktualisieren
          ansible.builtin.command:
            argv:
              - "{{ brew_bin }}"
              - "update"
          register: brew_update_result
          when: brew_stat.stat.exists
          changed_when: "'Already up-to-date.' not in brew_update_result.stdout"

        - name: Veraltete Homebrew-Pakete und Casks prüfen
          ansible.builtin.command:
            argv:
              - "{{ brew_bin }}"
              - "outdated"
              - "--verbose"
          register: brew_outdated_packages
          when: brew_stat.stat.exists
          changed_when: false

        - name: Ausstehende Homebrew-Updates anzeigen
          ansible.builtin.debug:
            var: brew_outdated_packages.stdout_lines
          when:
            - brew_stat.stat.exists
            - brew_outdated_packages.stdout != ""

        - name: Homebrew-Formulae (CLI-Tools) aktualisieren
          ansible.builtin.command:
            argv:
              - "{{ brew_bin }}"
              - "upgrade"
              - "--formula"
          register: brew_upgrade_formula
          when:
            - brew_stat.stat.exists
            - brew_outdated_packages.stdout != ""
          changed_when: true

        - name: Homebrew-Casks (GUI-Apps) aktualisieren
          ansible.builtin.command:
            argv:
              - "{{ brew_bin }}"
              - "upgrade"
              - "--cask"
          register: brew_upgrade_cask
          when:
            - brew_stat.stat.exists
            - brew_outdated_packages.stdout != ""
          changed_when: true
          failed_when: false

        - name: Ergebnis der aktualisierten Pakete ausgeben
          ansible.builtin.debug:
            msg:
              - "Formulae: {{ brew_upgrade_formula.stdout_lines | default([]) }}"
              - "Casks: {{ brew_upgrade_cask.stdout_lines | default([]) }}"
          when:
            - brew_stat.stat.exists
            - brew_outdated_packages.stdout != ""

    - name: Mac App Store (mas) Updates ausführen
      tags:
        - mas
      when: ansible_facts['hostname'] in ["L00026E", "HIER-ZWEITEN-HOSTNAME-EINTRAGEN"]
      vars:
        brew_prefix: "{{ ansible_facts['user_dir'] }}/b"
        mas_bin: "{{ brew_prefix }}/bin/mas"
      environment:
        PATH: "{{ brew_prefix }}/bin:{{ brew_prefix }}/sbin:{{ ansible_facts['env']['PATH'] }}"
      block:
        - name: Prüfen, ob mas vorhanden ist
          ansible.builtin.stat:
            path: "{{ mas_bin }}"
          register: mas_stat

        - name: Veraltete Mac App Store Apps prüfen
          ansible.builtin.command:
            argv:
              - "{{ mas_bin }}"
              - "outdated"
          register: mas_outdated_apps
          when: mas_stat.stat.exists
          changed_when: false

        - name: Ausstehende Mac App Store Updates anzeigen
          ansible.builtin.debug:
            var: mas_outdated_apps.stdout_lines
          when:
            - mas_stat.stat.exists
            - mas_outdated_apps.stdout != ""

        - name: Ausstehende Mac App Store Apps aktualisieren
          ansible.builtin.command:
            argv:
              - "{{ mas_bin }}"
              - "upgrade"
          register: mas_upgrade_result
          when:
            - mas_stat.stat.exists
            - mas_outdated_apps.stdout != ""
          changed_when: true
          failed_when: false

        - name: Ergebnis der aktualisierten App Store Apps ausgeben
          ansible.builtin.debug:
            var: mas_upgrade_result.stdout_lines
          when:
            - mas_stat.stat.exists
            - mas_outdated_apps.stdout != ""
