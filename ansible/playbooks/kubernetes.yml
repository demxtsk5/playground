---
- name: Install Kubernetes
  become: true
  hosts:
    - kube

  tasks:
    - name: Prepare Swap & Journal & APT
      block:
        - name: Part 1
          ansible.builtin.command:
            cmd: "swapoff -a"
          changed_when: false
        - name: Part 2
          ansible.builtin.replace:
            path: /etc/fstab
            regexp: '^([^#].*\sswap\s.*)$'
            replace: '# \1'
          changed_when: false
        - name: Limit systemd journal size
          ansible.builtin.lineinfile:
            path: /etc/systemd/journald.conf
            regexp: "^#?SystemMaxUse="
            line: "SystemMaxUse=200M"
        - name: Restart journald
          ansible.builtin.systemd:
            name: systemd-journald
            state: restarted
        - name: Clean apt cache
          ansible.builtin.command:
            cmd: apt clean
          changed_when: false

    - name: Kernel Module & Netzwerk Routing
      block:
        - name: Place Module k8s.conf
          ansible.builtin.copy:
            src: module.k8s.conf
            dest: /etc/modules-load.d/k8s.conf
            owner: root
            group: root
            mode: '0644'
        - name: Modprobe overlay
          ansible.builtin.command:
            cmd: "modprobe overlay"
          changed_when: false
        - name: Modprobe br_netfilter
          ansible.builtin.command:
            cmd: "modprobe br_netfilter"
          changed_when: false
        - name: Place Sysctl k8s.conf
          ansible.builtin.copy:
            src: sysctl.k8s.conf
            dest: /etc/sysctl.d/k8s.conf
            owner: root
            group: root
            mode: '0644'
        - name: Sytctl --system
          ansible.builtin.command:
            cmd: "sysctl --system"
          changed_when: false

    - name: Install Packages
      block:
        - name: Install containerd
          ansible.builtin.package:
            name: containerd
            state: present
        - name: Create containerd folder
          ansible.builtin.file:
            path: /etc/containerd
            state: directory
            mode: '0755'
            owner: root
            group: root
        - name: Do Something
          ansible.builtin.command:
            cmd: "containerd config default | sudo tee /etc/containerd/config.toml > /dev/null"
          changed_when: false
        - name: Do Something more
          ansible.builtin.replace:
            path: "/etc/containerd/config.toml"
            regexp: 'SystemdCgroup = false'
            replace: 'SystemdCgroup = true'
          changed_when: false
        - name: Start and enable containerd
          ansible.builtin.service:
            name: containerd
            state: restarted
            enabled: true

    - name: Vorbereitung K8s
      tags:
        - prepare_k8s
      block:
        - name: Verzeichnis für APT-Keyrings erstellen
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
        - name: Configure Kubernetes APT repository
          ansible.builtin.deb822_repository:
            name: kubernetes
            types: [deb]
            uris: "https://pkgs.k8s.io/core:/stable:/v1.28/deb/"
            suites: ["/"]
            components: []
            signed_by: "https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key"
            state: present
        - name: Paket-Cache manuell aktualisieren
          ansible.builtin.apt:
            update_cache: true
        - name: Install Packages
          ansible.builtin.package:
            name: "{{ item }}"
            state: present
          loop:
            - apt-transport-https
            - ca-certificates
            - curl
            - gpg
            - kubelet
            - kubeadm
            - kubectl
          loop_control:
            label: "{{ item }}"
        - name: Versionen von K8s-Paketen einfrieren (hold)
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: hold
          loop:
            - kubelet
            - kubeadm
            - kubectl
          loop_control:
            label: "{{ item }}"

    - name: Install K8s
      tags:
        - install_k8s
      when: ansible_host == "192.168.64.27"
      block:
        - name: Check Kubernetes API
          ansible.builtin.command:
            cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes
          register: k8s_check
          failed_when: false
          changed_when: false
        - name: Initialize Kubernetes control plane
          ansible.builtin.command:
            cmd: >
              kubeadm init
              --apiserver-advertise-address=192.168.64.27
              --pod-network-cidr=10.244.0.0/16
          failed_when: false
          changed_when: false
          when: k8s_check.rc != 0
        - name: Create .kube directory for root
          ansible.builtin.file:
            path: /root/.kube
            state: directory
            mode: "0700"
        - name: Copy admin kubeconfig
          ansible.builtin.copy:
            src: /etc/kubernetes/admin.conf
            dest: /root/.kube/config
            remote_src: true
            owner: root
            group: root
            mode: "0600"
        - name: Install Flannel CNI
          ansible.builtin.command:
            cmd: >
              kubectl apply -f
              https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
          environment:
            KUBECONFIG: /etc/kubernetes/admin.conf
          register: flannel_result
          changed_when: >
            'created' in flannel_result.stdout or
            'configured' in flannel_result.stdout
        - name: Generate join command
          ansible.builtin.command:
            cmd: kubeadm token create --print-join-command
          register: join_command
          changed_when: false
        - name: Show join command
          ansible.builtin.debug:
            msg: "{{ join_command.stdout }}"
        - name: Store join command
          ansible.builtin.set_fact:
            kubeadm_join_command: "{{ join_command.stdout }}"

    - name: Join workers to cluster
      tags:
        - worker_k8s
      when: ansible_host != "192.168.64.27"
      block:
        - name: Check if worker already joined
          ansible.builtin.stat:
            path: /etc/kubernetes/kubelet.conf
          register: kubelet_conf
        - name: Join worker to Kubernetes cluster
          ansible.builtin.command:
            cmd: "{{ hostvars['kube01'].kubeadm_join_command }}"
          register: join_result
          changed_when: join_result.rc == 0
          when: not kubelet_conf.stat.exists
