---
- name: Update OS
  become: true
  hosts:
    - all
  tasks:
    - name: Do OS updates on Debian
      when: ansible_facts['os_family'] == "Debian"
      block:
        - name: Run APT upgrade
          ansible.legacy.apt:
            update_cache: true
            autoclean: true
            autoremove: true
            upgrade: full
          register: upgrade_output
        - name: Display output of apt ugrade
          ansible.legacy.debug:
            var: upgrade_output
        - name: APT clean everything
          ansible.legacy.apt:
            update_cache: true
            autoclean: true
            autoremove: true
        - name: Remove files in cache
          ansible.legacy.file:
            path: /tmp/*
            state: absent
    - name: Do OS updates on Debian
      when: ansible_facts['os_family'] == "RedHat"
      block:
        - name: Run dnf update
          ansible.legacy.dnf:
            name: '*'
            state: latest
          register: upgrade_output
        - name: Display output of dnf update
          ansible.legacy.debug:
            var: upgrade_output
        - name: Remove files in cache
          ansible.legacy.file:
            path: /tmp/*
            state: absent
