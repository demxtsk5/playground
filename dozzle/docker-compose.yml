services:
  dozzle:
    image: amir20/dozzle:v11.5.0
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    networks:
      - caddy_net

  lynis-report:
    image: alpine:latest
    container_name: lynis-report
    restart: unless-stopped
    volumes:
      - /var/log/lynis-dozzle.log:/lynis.log:ro
    command: tail -n 350 -F /lynis.log

volumes:
  dozzle_data:

networks:
  caddy_net:
    external: true

