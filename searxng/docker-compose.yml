services:
  searxng:
    image: docker.io/searxng/searxng:2026.10.19-81371861f
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./config:/etc/searxng
      - ./data:/var/cache/searxng
    networks:
      - caddy_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  caddy_net:
    external: true
